<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Sustituido por el valor de `--base-href` en `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Previa: red social de proximidad para encontrar y organizar previas antes de salir de fiesta. Solo mayores de 18 años.">
  <meta name="theme-color" content="#7C4DFF">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph -->
  <meta property="og:title" content="Previa">
  <meta property="og:description" content="Encuentra o publica previas cerca de ti. Solo mayores de 18 años.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Previa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Previa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fondo oscuro desde el primer pintado: evita el fogonazo blanco. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B12; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
