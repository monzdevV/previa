name: previa
description: "Previa - red social de proximidad para organizar previas antes de salir de fiesta"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Textos de Material (calendario, dialogos) en espanol.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend: autenticacion, base de datos, tiempo real y almacenamiento.
  supabase_flutter: ^2.8.0

  # Estado e inyeccion de dependencias.
  flutter_riverpod: ^2.6.1

  # Navegacion declarativa con rutas protegidas.
  go_router: ^14.6.2

  # Mapa sobre OpenStreetMap: sin clave de API ni facturacion asociada.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Ubicacion del dispositivo y permisos.
  geolocator: ^13.0.2

  # Configuracion fuera del codigo: las claves no van al repositorio.
  flutter_dotenv: ^5.2.1

  # Fechas y textos en espanol.
  intl: ^0.20.3

  # Imagenes de perfil con cache.
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Iconos de la app y pantalla de arranque (config al final del fichero;
  # regenerar con `dart run flutter_launcher_icons` y
  # `dart run flutter_native_splash:create`).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0B12"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#0B0B12"
    theme_color: "#0B0B12"

flutter_native_splash:
  color: "#0B0B12"
  image: assets/images/splash.png
  color_dark: "#0B0B12"
  image_dark: assets/images/splash.png
  android_12:
    color: "#0B0B12"
    image: assets/images/icon_foreground.png
    icon_background_color: "#0B0B12"
  web: false
